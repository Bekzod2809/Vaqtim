databases:
  - name: vaqtim-db
    plan: free
    databaseName: vaqtim
    user: vaqtim

services:
  - type: web
    name: vaqtim
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/products
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: vaqtim-db
          property: connectionString
      - key: Jwt__SecurityKey
        generateValue: true
      # Telegram bot tokeni maxfiy: qiymati git'ga yozilmaydi,
      # Render Dashboard -> vaqtim -> Environment bo'limida qo'lda kiritiladi.
      - key: Telegram__BotToken
        sync: false
