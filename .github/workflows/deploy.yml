name: CI / CD

# main'ga push qilinganda: build -> serverga deploy.
# Pull request'da faqat build tekshiriladi, deploy qilinmaydi.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Ikki push ketma-ket kelsa, deploy'lar bir-biriga aralashmasin: navbat bilan ishlaydi
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Backend build
        run: dotnet build WatchShop.sln -c Release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    name: Deploy (serverga)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: SSH sozlash
        run: |
          mkdir -p ~/.ssh
          # tr -d '\r': Windows'da nusxalangan kalitda qator oxiri belgilari bo'lishi mumkin,
          # ular bilan ssh kalitni o'qiy olmaydi ("error in libcrypto")
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo "Kalit o'qildi"

      # Serverdagi deploy kaliti faqat /opt/vaqtim/deploy.sh ni ishga tushira oladi:
      # arxiv shu skriptga yuboriladi, u backend'ni build qilib, frontend'ni almashtiradi
      - name: Serverga yuborish
        run: |
          tar -czf - --exclude=bin --exclude=obj --exclude='*.user' src/WatchShop.Api deploy dist \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes root@${{ secrets.SERVER_HOST }}

      - name: Saytni tekshirish
        run: curl -sf --retry 5 --retry-delay 3 https://vaqtim.bekzodxasanov.uz/api/mahsulotlar > /dev/null
