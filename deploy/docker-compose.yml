name: vaqtim

# Maxfiy qiymatlar (POSTGRES_PASSWORD, JWT_SECURITY_KEY) shu papkadagi .env faylidan olinadi.
# .env faqat serverda turadi va git'ga tushmaydi.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaqtim
      POSTGRES_USER: vaqtim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Faqat serverning o'zidan ko'rinadi (internetdan emas). pgAdmin bunga SSH tunnel orqali ulanadi
      - "127.0.0.1:5432:5432"

  api:
    build: ../src/WatchShop.Api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=vaqtim;Username=vaqtim;Password=${POSTGRES_PASSWORD}
      Jwt__SecurityKey: ${JWT_SECURITY_KEY}
    ports:
      # Faqat serverning o'zidan (Nginx) ko'rinadi, internetdan emas
      - "127.0.0.1:5100:8080"
    volumes:
      # Yuklangan rasmlar qayta deploy qilinganda o'chib ketmasligi uchun
      - rasmlar:/app/wwwroot/rasmlar

volumes:
  db_data:
  rasmlar:
