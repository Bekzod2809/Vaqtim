server {
    server_name vaqtim.bekzodxasanov.uz;

    # React build (frontend/dist)
    root /var/www/vaqtim;
    index index.html;

    # Rasm yuklash 5 MB gacha ruxsat etilgan; Nginx standarti 1 MB bo'lgani uchun oshiramiz
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rasmlar/ {
        proxy_pass http://127.0.0.1:5100;
        expires 30d;
    }

    # Vite build'dagi fayl nomlarida hash bor, shuning uchun ularni uzoq keshlash xavfsiz
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: /mahsulot/5 kabi manzillar ham index.html'ga tushishi kerak
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vaqtim.bekzodxasanov.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vaqtim.bekzodxasanov.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = vaqtim.bekzodxasanov.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name vaqtim.bekzodxasanov.uz;
    return 404; # managed by Certbot


}